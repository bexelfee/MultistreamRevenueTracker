[pytest]
pythonpath = src
markers =
    e2e: Playwright tests against a live app instance (requires dist build or E2E_TARGET=source)
    e2e_shutdown: Terminates the app under test (run last or alone)
    e2e_restart: In-process restart (closes WebSockets; run separately)
    no_state_reset: Skip the autouse state-reset fixture for this test
addopts = --strict-markers
